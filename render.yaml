# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> point at this repo (root).
# Render reads this file and provisions both services below. Env vars marked
# `sync: false` are prompted for in Render's UI, never stored in this file.

services:
  - type: web
    name: judgment-ledger-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CONNECTOR_API_KEY
        sync: false
      - key: YOXA_TRIGGER_URL
        sync: false
      - key: YOXA_DEPLOYMENT_SECRET
        sync: false
      - key: YOXA_HITL_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: YOXA_HITL_RESPONSE_SECRET
        sync: false

  - type: web
    name: judgment-ledger-ui
    runtime: static
    rootDir: judgment-ledger
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # HashRouter is used specifically so no SPA rewrite rule is needed here —
    # every route is a URL fragment (#/escalation), served by the same index.html.
